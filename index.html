<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Penalty King - Fixed Legs</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a1a0f;font-family:Arial,sans-serif;overflow:hidden;height:100vh;display:flex;justify-content:center;align-items:center;color:#fff}.game{width:100%;max-width:480px;height:100vh;max-height:900px;position:relative;background:linear-gradient(#1a4d2e 0%,#2d7a3f 45%,#1a5c2a 100%);overflow:hidden}.crowd{position:absolute;top:0;left:0;right:0;height:62px;background:repeating-linear-gradient(90deg,#ff4444 0 8px,#ffdd00 8px 16px,#4488ff 16px 24px,#fff 24px 32px)}.crowd:after{content:"👏👏👏👏👏👏👏👏👏👏";position:absolute;top:14px;left:0;right:0;text-align:center;font-size:26px}.scorebar{position:absolute;top:68px;left:10px;right:10px;display:flex;justify-content:space-between;background:rgba(0,0,0,.75);padding:9px 12px;border-radius:12px;z-index:30;font-weight:900;font-size:14px}.round{position:absolute;top:110px;left:50%;transform:translateX(-50%);background:#ff4444;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:900;z-index:30;white-space:nowrap}.goal-wrap{position:absolute;top:95px;left:50%;transform:translateX(-50%);width:94%;height:280px;z-index:5}.goal-back{position:absolute;inset:12px 20px 0 20px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(0,0,0,.35));background-image:repeating-linear-gradient(0deg,transparent 0 10px,rgba(255,255,255,.85) 10px 11px),repeating-linear-gradient(90deg,transparent 0 10px,rgba(255,255,255,.85) 10px 11px)}.goal-net{position:absolute;inset:16px 0 0 0;background:repeating-linear-gradient(0deg,transparent 0 12px,rgba(255,255,255,.85) 12px 13px),repeating-linear-gradient(90deg,transparent 0 12px,rgba(255,255,255,.85) 12px 13px);background-color:rgba(255,255,255,.08);border:6px solid #fff;border-bottom:none}.goal-line{position:absolute;bottom:0;left:0;right:0;height:4px;background:#fff}.keeper{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:90px;height:140px;z-index:10;transition:all .45s}.keeper svg{width:100%;height:100%}.keeper.dive-left{left:8%;transform:rotate(-75deg) translateY(20px)}.keeper.dive-right{left:78%;transform:rotate(75deg) translateY(20px)}.keeper.jump{transform:translateX(-50%) translateY(-18px)}.shooter{position:absolute;bottom:175px;left:42%;transform:translateX(-50%);width:115px;height:150px;z-index:20;transition:all .35s}.shooter svg{width:100%;height:100%}.shooter.run1{left:46%;transform:translateX(-50%) translateY(-4px) rotate(-3deg)}.shooter.run2{left:50%;transform:translateX(-50%) translateY(-2px) rotate(3deg)}.shooter.kick{left:52%;transform:translateX(-50%) translateY(-2px)}.shooter.kick #kickLeg{transform:rotate(-38deg);transform-origin:63px 80px}.shooter.kick #leftLeg{transform:rotate(15deg);transform-origin:47px 80px}#kickLeg,#leftLeg{transition:all .18s}.ball{position:absolute;bottom:205px;left:59%;transform:translateX(-50%);width:34px;height:34px;background:radial-gradient(circle at 35% 35%,#fff,#ddd 50%,#999);border-radius:50%;z-index:25;box-shadow:0 4px 10px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .6s}.ball.fly{scale:.85}.controls{position:absolute;bottom:0;left:0;right:0;height:135px;padding:14px;background:#111;z-index:40;border-top:3px solid #ffdd00}.controls-title{text-align:center;font-size:15px;margin-bottom:12px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.grid button{padding:18px 0;border:none;border-radius:14px;font-size:18px;font-weight:900;cursor:pointer;background:#fff;color:#111}.grid button:active{background:#ffdd00}.msg{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) scale(0);background:#ffdd00;color:#111;padding:12px 20px;border-radius:16px;font-size:26px;font-weight:900;z-index:50;transition:.3s;white-space:nowrap}.msg.show{transform:translate(-50%,-50%) scale(1)}.confetti{position:absolute;top:150px;left:0;right:0;text-align:center;font-size:30px;z-index:45;display:none}.confetti.show{display:block}
</style></head><body><div class="game"><div class="crowd"></div><div class="scorebar"><span>⭐ Score: <b id="score">0</b></span><span>⚽ <b id="roundTxt">1 / 5</b></span><span>🏆 Best: <b id="best">0</b></span></div><div class="round" id="roundLabel">Kick 1 - Shoot!</div><div class="goal-wrap"><div class="goal-back"></div><div class="goal-net"></div><div class="keeper" id="keeper"><svg viewBox="0 0 100 150"><ellipse cx="50" cy="18" rx="16" ry="16" fill="#ffcc99"/><path d="M34 12 Q50 0 66 12 Q66 4 50 2 Q34 4 34 12" fill="#222"/><rect x="38" y="34" width="24" height="48" rx="10" fill="#ffdd00"/><text x="50" y="62" font-size="20" text-anchor="middle" font-weight="900" fill="#000">1</text><path d="M38 40 L18 68" stroke="#ffcc99" stroke-width="9" stroke-linecap="round"/><circle cx="15" cy="72" r="7" fill="#222"/><path d="M62 40 L82 68" stroke="#ffcc99" stroke-width="9" stroke-linecap="round"/><circle cx="85" cy="72" r="7" fill="#222"/><path d="M42 82 L38 125" stroke="#111" stroke-width="11" stroke-linecap="round"/><path d="M58 82 L62 125" stroke="#111" stroke-width="11" stroke-linecap="round"/><ellipse cx="38" cy="132" rx="10" ry="5" fill="#000"/><ellipse cx="62" cy="132" rx="10" ry="5" fill="#000"/></svg></div><div class="goal-line"></div></div><div class="shooter" id="shooter"><svg viewBox="0 0 110 150"><ellipse cx="55" cy="18" rx="15" ry="15" fill="#ffcc99"/><path d="M40 10 Q55 0 70 10 Q70 2 55 0 Q40 2 40 10" fill="#111"/><rect x="42" y="32" width="26" height="34" rx="8" fill="#e63946"/><rect x="42" y="66" width="26" height="16" rx="4" fill="#111"/><text x="55" y="56" font-size="18" text-anchor="middle" font-weight="900" fill="#fff">9</text><path d="M42 38 L22 62" stroke="#ffcc99" stroke-width="9" stroke-linecap="round"/><circle cx="22" cy="64" r="5" fill="#ffcc99"/><path d="M68 38 L88 62" stroke="#ffcc99" stroke-width="9" stroke-linecap="round"/><circle cx="88" cy="64" r="5" fill="#ffcc99"/><path id="leftLeg" d="M47 82 L42 118" stroke="#111111" stroke-width="11" stroke-linecap="round"/><path id="kickLeg" d="M63 82 L80 112" stroke="#111111" stroke-width="11" stroke-linecap="round"/><ellipse cx="42" cy="126" rx="10" ry="5" fill="#000"/><ellipse cx="82" cy="120" rx="10" ry="5" fill="#000"/></svg></div><div class="ball" id="ball">⚽</div><div class="msg" id="msg">GOAL!</div><div class="confetti" id="confetti">🎉🎊⚽🎉🎊</div><div class="controls"><div class="controls-title">👇 Where do you want to shoot?</div><div class="grid"><button onclick="shoot('left')">⬅️ Left</button><button onclick="shoot('mid')">🎯 Center</button><button onclick="shoot('right')">➡️ Right</button></div></div></div><script>let score=0,round=1,best=+(localStorage.getItem('best')||0);document.getElementById('best').textContent=best;let playing=false;function playSound(type){try{let ctx=new (window.AudioContext||window.webkitAudioContext)();if(type==='kick'){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=150;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.5,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+.15);o.start();o.stop(ctx.currentTime+.15);}if(type==='goal'){for(let i=0;i<3;i++){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=400+i*200;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.3,ctx.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+i*.12+.3);o.start(ctx.currentTime+i*.12);o.stop(ctx.currentTime+i*.12+.3);}let len=ctx.sampleRate*1.2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*.25*(1-i/len);let src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);src.start();}if(type==='save'){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=250;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+.4);o.start();o.stop(ctx.currentTime+.4);}}catch(e){}}function shoot(side){if(playing)return;playing=true;let k=document.getElementById('keeper'),b=document.getElementById('ball'),msg=document.getElementById('msg'),s=document.getElementById('shooter'),c=document.getElementById('confetti');s.className='shooter run1';setTimeout(()=>{s.className='shooter run2';},180);setTimeout(()=>{s.className='shooter kick';playSound('kick');},360);let kMove=Math.random();k.className='keeper';setTimeout(()=>{if(kMove<0.35)k.classList.add('dive-left');else if(kMove<0.7)k.classList.add('dive-right');else k.classList.add('jump');},400);let x = side==='left'? '16%' : side==='right'? '84%' : '50%';let y = 510;setTimeout(()=>{b.style.left=x;b.style.bottom=y+'px';b.classList.add('fly');},500);let saved = !( (side==='left'&&kMove<0.35)||(side==='right'&&kMove>=0.35&&kMove<0.7)||(side==='mid'&&kMove>=0.7) );setTimeout(()=>{if(saved){score+=10;playSound('goal');msg.textContent='GOAL! 🎉 +10';msg.style.background='#00ff88';msg.style.color='#111';c.classList.add('show');}else{playSound('save');msg.textContent='Saved! 🧤';msg.style.background='#ff4444';msg.style.color='white';}msg.classList.add('show');document.getElementById('score').textContent=score;if(score>best){best=score;localStorage.setItem('best',best);document.getElementById('best').textContent=best;}},1150);setTimeout(()=>{round++;c.classList.remove('show');if(round>5){msg.textContent='Finished! Score: '+score;if(score>=30)msg.textContent+=' 👑 Legend!';setTimeout(()=>{round=1;score=0;document.getElementById('score').textContent=0;},2200);}document.getElementById('roundTxt').textContent=Math.min(round,5)+' / 5';document.getElementById('roundLabel').textContent='Kick '+Math.min(round,5)+' - Shoot!';msg.classList.remove('show');b.style.left='59%';b.style.bottom='205px';b.classList.remove('fly');k.className='keeper';s.className='shooter';playing=false;},2400);}</script></body></html>
